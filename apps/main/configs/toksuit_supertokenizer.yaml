dump_dir: /scratch/gsa/train/supertokenizer
name: supertokenizer
# dump_dir: !!!CHANGE_THIS!!!
steps: 100_000
# steps: 60_000
probe_freq: null
seed: 777
grad_acc_steps: 16

optim:
  lr: 3e-3
  weight_decay: 0.033
  warmup: 5000
  lr_min_ratio: 0.000001
  clip: 1.0

distributed:
  fsdp_type: full_shard
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  # compile: false 
  # tp_size: 2
  tp_size: 1
  compile: true

model:
  dim: 2048
  n_layers: 25
  n_heads: 16
  # vocab_size: 200019
  # vocab_size: 942324
  vocab_size: 851586


data:
  root_dir: /scratch/gsa/supertokenizer_data/
  sources:
    fw_edu: 0.4
    ita_Latn: 0.03
    tur_Latn: 0.03
    cmn_Hani: 0.03
    fas_Arab: 0.03
    rus_Cyrl: 0.03
    deu_Latn: 0.03
    spa_Latn: 0.03
    jpn_Jpan: 0.03
    fra_Latn: 0.03
    por_Latn: 0.03
    pol_Latn: 0.03
    nld_Latn: 0.03
    ind_Latn: 0.03
    ces_Latn: 0.03
    arb_Arab: 0.03
    hun_Latn: 0.03
    swe_Latn: 0.03
    ell_Grek: 0.03
    dan_Latn: 0.03
    vie_Latn: 0.03
  batch_size: 2
  prefetch_size: 1024
  seq_len: 4096
  n_views: 2
  load_async: true
  add_eos: true
  # tokenizer:
  #   name: huggingface
  #   path: meta-llama/Llama-3.2-1B

  tokenizer:
      name: supertokenizer
      tokenizers:
        - name: huggingface
          path: CohereLabs/aya-expanse-8b
        - name: huggingface
          path: bigscience/bloom
        - name: huggingface
          path: google/byt5-small
        - name: huggingface
          path: common-pile/comma-v0.1
        - name: huggingface
          path: google/gemma-2-2b
        - name: huggingface
          path: gpt2
        - name: tiktoken
          path: gpt-4o
        - name: huggingface
          path: meta-llama/Llama-3.2-1B
        - name: huggingface
          path: google-bert/bert-base-multilingual-cased
        - name: huggingface
          path: microsoft/Phi-3-mini-4k-instruct
        - name: huggingface
          path: Qwen/Qwen3-8B
        - name: tekken
          path: tekken
        - name: tokenmonster
          path: englishcode-32000-consistent-v1
        - name: huggingface
          path: facebook/xglm-564M

profiling:
  run: true
  mem_warmup: 0
  mem_steps: 4
  profile_warmup: 100
  profile_steps: 4

checkpoint:
  # init_ckpt_path: /project/def-craffel/gsa/tokenizers/supertokenizer/model_dcp
  # init_ckpt_path: /scratch/gsa/train/supertokenizer/checkpoints/0000002400/
  dump:
    every: 400
    keep: 3
  eval:
    every: 1000000
    keep: -1

logging:
  freq: 1
  wandb: 
    project: supertokenizer
    entity: gsaltintas
    tags: 
      - pre-training
      - debug
    group: supertokenizer
    # group: llama-3.2
    # name: Optional[str] = None
    # notes: Optional[str] = None
    sync_tensorboard: true
    # resume_from: Optional[str] = None

async_eval_gpus: 8
eval:
  harness:
    tasks:
      - hellaswag
      - piqa
      - arc_easy
      - arc_challenge

      - include_base_44_turkish
      - include_base_44_italian
      - include_base_44_chinese

      - belebele_pes_Arab
      - belebele_eng_Latn
      - belebele_ita_Latn
      - belebele_tur_Latn
      - belebele_zho_Hans

      - xnli_en
      - xnli_tr
      - xnli_zh

      # - humaneval
    confirm_run_unsafe_code: true

  # validation:
  #   max_steps: 1000
  generator:
    max_tokens: 16384
    dtype: bf16
    add_bos: False

