dump_dir: /root/lingua_dump/train
name: supertokenizer
# dump_dir: !!!CHANGE_THIS!!!
steps: 100_000
# steps: 60_000
probe_freq: null
seed: 777
grad_acc_steps: 16

optim:
  lr: 3e-3
  weight_decay: 0.033
  warmup: 5000
  lr_min_ratio: 0.000001
  clip: 1.0

distributed:
  fsdp_type: full_shard
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  # compile: false
  # tp_size: 2
  tp_size: 1
  compile: true

model:
  dim: 2048
  n_layers: 25
  n_heads: 16
  # vocab_size: 200019
  # vocab_size: 942324
  # vocab_size: 851586


data:
  root_dir: /root/lingua_dump/data
  sources:
    fw_edu: 1.

  batch_size: 2
  prefetch_size: 1024
  seq_len: 4096
  n_views: 2
  load_async: true
  add_eos: true
  tokenizer:
    name: tiktoken
    path: /root/lingua_dump/tokenizer/llama/original/tokenizer.model

profiling:
  run: true
  mem_warmup: 0
  mem_steps: 4
  profile_warmup: 100
  profile_steps: 4

checkpoint:
  # init_ckpt_path: /project/def-craffel/gsa/tokenizers/supertokenizer/model_dcp
  # init_ckpt_path: /scratch/gsa/train/supertokenizer/checkpoints/0000002400/
  dump:
    every: 400
    keep: 3
  eval:
    every: 1000000
    keep: -1

logging:
  freq: 1
 

async_eval_gpus: 8