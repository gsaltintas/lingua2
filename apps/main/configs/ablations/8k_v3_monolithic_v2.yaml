## Training superset tokenizer with individual tokenizers trained on Fineweb-2-hq
# use with apps/main/configs/flexitok/llama_1b_base.yaml
## v2 corrects bos and eos in the tokenizer
# python -m lingua.stool_rcp script=apps.main.train ngpu=8 ncpu=15 mem=1000G nodes=1 config=[apps/main/configs/flexitok/llama_1b_base.yaml,apps/main/configs/ablations/8k_v3_monolithic_v2.yaml]
# python -m lingua.stool_ccdb ngpu=1 ncpu=1 nodes=1 launcher=bash script=apps.main.train config=[apps/main/configs/flexitok/llama_1b_base.yaml,apps/main/configs/ablations/8k_v3_monolithic.yaml]

name: 8k_v3_monolithic_v2
dump_dir: /fsx/craffel/lingua_logs/8k_v3_monolithic_v2
grad_acc_steps: 4

data:
  batch_size: 8
  tokenizer:
    name: huggingface
    path: flexitok/bpe_ltr_monolithic_moto_v2
checkpoint:
  path: /fsx/craffel/lingua_logs/checkpoints/8k_v3_monolithic_v2
  dump:
    # increase the dump frequency in case of pre-emption
    every: 1000
    keep: 3

logging:
  wandb:
    entity: gsaltintas